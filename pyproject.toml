[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acceptance-gate"
version = "0.1.0"
description = "Three necessary conditions for the capacity to act against one's strongest schema"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Nevzat Subasioglu" }]
keywords = ["metacognition", "self-regulation", "belief-updating", "computational-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# No runtime dependencies. The model is a product of three numbers; anything more
# would be someone else's code standing between a reader and the claim.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/RealNevoEvo/acceptance-gate"
Issues = "https://github.com/RealNevoEvo/acceptance-gate/issues"
Explainer = "https://realnevoevo.github.io/acceptance-gate/"

[tool.hatch.build.targets.wheel]
packages = ["src/acceptance_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# doctest-glob nimmt die >>> Bloecke im README mit. Ohne das lief die Prosa nie mit,
# obwohl der Abschnitt "What the tests are for" genau das behauptet hat.
addopts = "--doctest-modules --doctest-glob=*.md"
testpaths = ["tests", "src", "README.md"]
